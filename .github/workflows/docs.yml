# Documentation on GitHub Pages: the same build as the `docs` job of .gitlab-ci.yml (GitLab Pages), from the default
# branch. The figures are computed by the examples, the API reference is read from the installed package.
#
# Settings > Pages > Build and deployment > Source: "GitHub Actions". A private repository needs a paid plan
# (GitHub Pro, Team or Enterprise) for Pages, and the site is public anyway.
name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYSTREAMPU_REF: v1.2.1  # as .gitlab-ci.yml and pyproject.toml

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm: version from the git history

      - name: AFF3CT and its dependencies, reference curves, LDPC matrices
        run: |
          git submodule update --init lib/aff3ct
          git -C lib/aff3ct submodule update --init --recursive lib/cli lib/MIPP lib/date
          scripts/fetch_aff3ct_data.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('internal/**', 'CMakeLists.txt', '.gitmodules') }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Build tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ccache ninja-build
          python -m pip install --upgrade pip
          python -m pip install pybind11==3.0.4 scikit-build-core setuptools_scm pybind11-stubgen==2.5.5

      - name: pyStreamPU
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: python -m pip install -v "git+https://github.com/rtajan/pystreampu.git@${PYSTREAMPU_REF}"

      - name: pyAFF3CT
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: |
          python -m pip install -v ".[docs]" --no-build-isolation
          ccache --show-stats

      - name: Figures (computed by the examples)
        run: python scripts/doc_figures.py --threads 4

      - name: Site
        env:
          NO_MKDOCS_2_WARNING: "1"
          DOCS_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          DOCS_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          DOCS_EDIT_URI: edit/main/docs/
        run: mkdocs build --strict --site-dir public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
