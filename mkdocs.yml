site_name: pyAFF3CT
site_description: Python interface of AFF3CT, the forward error correction toolbox, built on pyStreamPU
# GitLab by default; the GitHub workflow (.github/workflows/docs.yml) sets these variables for GitHub Pages
site_url: !ENV [DOCS_SITE_URL, "https://rtajan.pages.bordeaux-inp.fr/pyaff3ct/"]
repo_url: !ENV [DOCS_REPO_URL, "https://gitlab.bordeaux-inp.fr/rtajan/pyaff3ct"]
repo_name: rtajan/pyaff3ct
edit_uri: !ENV [DOCS_EDIT_URI, "-/edit/main/docs/"]

nav:
  - Home: index.md
  - Installation: install.md
  - Tutorial:
      - A first chain: tutorial/first_chain.md
      - Simulating BER / FER curves: tutorial/bfer.md
      - Codecs: tutorial/codecs.md
      - Factories and the AFF3CT command line: tutorial/command_line.md
  - How-to guides:
      - Polar codes: guides/polar.md
      - LDPC codes: guides/ldpc.md
      - Turbo codes: guides/turbo.md
      - Modulations and channels: guides/modems.md
      - Fixed-point decoding: guides/fixed_point.md
  - Concepts: concepts.md
  - API reference:
      - reference/index.md
      - Codecs: reference/codec.md
      - Modules: reference/modules.md
      - Tools: reference/tools.md
      - Factories: reference/factory.md
  - Development: development.md

# internal design notes (in French) and generated data: not part of the site
exclude_docs: |
  design/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # not the root of the repository: its aff3ct/ (sources, without the compiled extension) would be imported
          # instead of the installed package
          paths: [docs]
          options:
            # aff3ct._ext is a compiled extension and most functions are built at import (signatures included):
            # the installed package is inspected
            allow_inspection: true
            force_inspection: true
            docstring_style: google
            docstring_options:
              # the type stubs installed with the package (scripts/gen_stubs.py) declare the overloads of the
              # bindings: their docstrings list the arguments of every overload, checked against the first one only
              warn_unknown_params: false
              warn_missing_types: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_source: false
            separate_signature: true
            show_signature_annotations: false
            members_order: alphabetical
            heading_level: 3
            filters: ["!^_"]
            merge_init_into_class: true
            show_if_no_docstring: false

theme:
  name: material
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      dedent_subsections: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      toc_depth: 3
      title: Contents

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
