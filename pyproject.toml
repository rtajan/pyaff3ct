[build-system]
# streampu is needed at build time (pybind11/StreamPU CMake config and headers of pystreampu): until it is on PyPI,
# build with `pip install --no-build-isolation .` in an environment where streampu is installed.
requires = ["scikit-build-core>=1.0", "setuptools_scm", "pybind11==3.0.4", "streampu"]
build-backend = "scikit_build_core.build"

[project]
name = "aff3ct"
authors = [{name = "AFF3CT Team", email = "aff3ct-contact@inria.fr"}]
requires-python = ">=3.10"
description = "Python interface of AFF3CT (forward error correction toolbox), built on pystreampu"
readme = "README.md"
license = "MIT"
dependencies = [
    "numpy",
    "streampu",
    # Same pybind11 ABI as streampu (internals v11, stable within the 3.0 series)
    "pybind11>=3.0.4,<3.1",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=6.0", "pytest-xdist", "pybind11-stubgen==2.5.5", "black==26.5.1", "isort==8.0.1", "flake8"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.define.CMAKE_CXX_FLAGS = "-Wall -funroll-loops -fvisibility=hidden -fvisibility-inlines-hidden"
wheel.packages = ["aff3ct"]
wheel.install-dir = "aff3ct"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["aff3ct/_version.py"]
sdist.exclude = ["/build/", "/dist/", "/lib/aff3ct/refs/", "/lib/aff3ct/conf/"]

[tool.setuptools_scm]
write_to = "aff3ct/_version.py"
version_scheme = "post-release"
fallback_version = "0.0.0"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
